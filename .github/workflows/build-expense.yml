name: Build Expense App

on:
  push:
    branches: [main]
    paths:
      - 'app-expense/**'
      - '.github/workflows/build-expense.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app-expense/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix app-expense

      - name: Build
        run: npm run build --prefix app-expense

      - name: Commit build output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/expense/
          git diff --cached --quiet && echo "No changes to commit" || (git commit -m "build(expense): vendor bundle via CI" && git push)
