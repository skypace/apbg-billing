<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="Compressed gas cylinders stored upright chained and capped versus unsafe freestanding or lying loose">
<style>
 .ttl{font:700 17px system-ui,sans-serif;fill:#0F172A}
 .sub{font:12px system-ui,sans-serif;fill:#475569}
 .dgr{font:700 13px system-ui,sans-serif;fill:#B91C1C}
 .ok{font:700 13px system-ui,sans-serif;fill:#15803D}
</style>
<text x="16" y="26" class="ttl">A knocked-over cylinder with a sheared valve goes through cinder block</text>
<line x1="40" y1="220" x2="680" y2="220" stroke="#1F4E79" stroke-width="2.5"/>

<!-- correct: upright, chained, capped -->
<g>
<rect x="96" y="110" width="34" height="110" rx="14" fill="none" stroke="#15803D" stroke-width="3"/>
<rect x="150" y="110" width="34" height="110" rx="14" fill="none" stroke="#15803D" stroke-width="3"/>
<rect x="104" y="94" width="18" height="18" rx="4" fill="#15803D"/>
<rect x="158" y="94" width="18" height="18" rx="4" fill="#15803D"/>
<line x1="84" y1="150" x2="196" y2="150" stroke="#F4B400" stroke-width="4"/>
<line x1="84" y1="140" x2="84" y2="220" stroke="#94A3B8" stroke-width="3"/>
<line x1="196" y1="140" x2="196" y2="220" stroke="#94A3B8" stroke-width="3"/>
</g>
<text x="72" y="248" class="ok">Upright · chained · caps on</text>
<text x="60" y="268" class="sub">full and empty segregated and labelled</text>

<!-- wrong: freestanding -->
<rect x="320" y="110" width="34" height="110" rx="14" fill="none" stroke="#B91C1C" stroke-width="3"/>
<rect x="328" y="94" width="18" height="18" rx="4" fill="none" stroke="#B91C1C" stroke-width="2"/>
<path d="M360 120 q16 -8 26 4" stroke="#B91C1C" stroke-width="2" fill="none" marker-end="url(#t)"/>
<defs><marker id="t" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#B91C1C"/></marker></defs>
<text x="292" y="248" class="dgr">Freestanding</text>

<!-- wrong: lying down -->
<rect x="440" y="180" width="110" height="34" rx="14" fill="none" stroke="#B91C1C" stroke-width="3"/>
<text x="440" y="248" class="dgr">Lying loose / rolled</text>

<!-- rules -->
<rect x="580" y="60" width="124" height="176" rx="10" fill="#FEF2F2" stroke="#FCA5A5"/>
<text x="594" y="86" class="dgr">Never</text>
<text x="594" y="110" class="sub">lift by the valve</text>
<text x="594" y="130" class="sub">or the cap</text>
<text x="594" y="154" class="sub">leave in a sealed</text>
<text x="594" y="170" class="sub">vehicle or in sun</text>
<text x="594" y="194" class="sub">use oil/grease on</text>
<text x="594" y="210" class="sub">CO₂ fittings</text>
<text x="16" y="290" class="sub">Open valves slowly, outlet pointed away · leak-check with soapy water, never a flame · insulated gloves + eye protection</text>
</svg>
