<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PACER Margin Analytics</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0e17;--sf:#111827;--sf2:#1a2235;--bd:#1e2d4a;--ac:#22d3ee;--ac2:#818cf8;--gn:#34d399;--rd:#f87171;--am:#fbbf24;--tx:#e2e8f0;--mt:#64748b}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}
.mn{font-family:'Courier New',monospace}
.tb{background:var(--sf);border-bottom:1px solid var(--bd);padding:12px 24px;display:flex;align-items:center;justify-content:space-between}
.tb .lg{font-weight:700;font-size:13px;letter-spacing:1.5px;color:var(--ac)}
.tb .lg small{color:var(--mt);font-weight:400;font-size:10px;margin-left:8px;letter-spacing:.5px}
.ma{padding:18px 24px}
.pt{font-size:20px;font-weight:700;margin-bottom:18px;display:flex;align-items:center;gap:8px}
.bg{font-size:9px;padding:2px 7px;border-radius:3px;font-weight:600;letter-spacing:.5px}
.bg-l{background:rgba(52,211,153,.15);color:var(--gn)}
.bg-p{background:rgba(251,191,36,.15);color:var(--am)}
.gr{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.cd{background:var(--sf);border:1px solid var(--bd);border-radius:7px;padding:16px 18px}
.ct{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--mt);margin-bottom:6px}
.cv{font-size:26px;font-weight:700;line-height:1.1}
.cs{font-size:11px;color:var(--mt);margin-top:3px}
table{width:100%;border-collapse:collapse;font-size:12px}
thead th{text-align:left;padding:7px 10px;font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(--mt);border-bottom:1px solid var(--bd);font-weight:600}
tbody td{padding:7px 10px;border-bottom:1px solid var(--bd)}
tbody tr:hover{background:var(--sf2)}
.ld{display:flex;align-items:center;justify-content:center;padding:40px;color:var(--mt);font-size:12px}
@media(max-width:768px){.ma{padding:12px}.tb{padding:10px 14px}.g4{grid-template-columns:repeat(2,1fr)}.g3,.g2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const SB_URL='https://gfsdpwiqzshhexkofiif.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdmc2Rwd2lxenNoaGV4a29maWlmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU1OTUyMzcsImV4cCI6MjA5MTE3MTIzN30.AygnPJwQ5NfIeKwPtkO6tgVYmkV3MAxL1lMFwN9HPnY';
const sbAuth = supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: true, autoRefreshToken: true } });

async function sbq(tbl, params) {
  var url = SB_URL + '/rest/v1/' + tbl;
  if (params) url = url + '?' + params;
  var res = await fetch(url, {
    headers: { 'apikey': SB_KEY, 'Accept-Profile': 'ops', 'Content-Type': 'application/json' }
  });
  if (!res.ok) return [];
  return res.json();
}

async function _sbToken() {
  try {
    var s = await sbAuth.auth.getSession();
    return (s && s.data && s.data.session && s.data.session.access_token) || SB_KEY;
  } catch (e) { return SB_KEY; }
}

async function sbrpc(fn, args) {
  var token = await _sbToken();
  var res = await fetch(SB_URL + '/rest/v1/rpc/' + fn, {
    method: 'POST',
    headers: {
      'apikey': SB_KEY,
      'Authorization': 'Bearer ' + token,
      'Content-Profile': 'ops',
      'Content-Type': 'application/json'
    },
    body: JSON.stringify(args || {})
  });
  if (!res.ok) { console.error('rpc ' + fn, res.status, await res.text()); return []; }
  return res.json();
}

async function sbWriteHeaders() {
  var token = await _sbToken();
  return {
    'apikey': SB_KEY,
    'Authorization': 'Bearer ' + token,
    'Content-Profile': 'ops',
    'Accept-Profile': 'ops',
    'Content-Type': 'application/json',
    'Prefer': 'return=representation'
  };
}
async function sbInsert(table, row) {
  var headers = await sbWriteHeaders();
  var res = await fetch(SB_URL + '/rest/v1/' + table, { method: 'POST', headers: headers, body: JSON.stringify(row) });
  if (!res.ok) { console.error('insert', table, res.status, await res.text()); return null; }
  return res.json();
}
async function sbUpdate(table, where, patch) {
  var headers = await sbWriteHeaders();
  var res = await fetch(SB_URL + '/rest/v1/' + table + '?' + where, { method: 'PATCH', headers: headers, body: JSON.stringify(patch) });
  if (!res.ok) { console.error('update', table, res.status, await res.text()); return null; }
  return res.json();
}
async function sbDelete(table, where) {
  var headers = await sbWriteHeaders();
  var res = await fetch(SB_URL + '/rest/v1/' + table + '?' + where, { method: 'DELETE', headers: headers });
  if (!res.ok) { console.error('delete', table, res.status, await res.text()); return false; }
  return true;
}

function fm(n) { return n == null ? '-' : '$' + Number(n).toLocaleString('en-US', {maximumFractionDigits:0}) }
function fd(n) { return n == null ? '-' : '$' + Number(n).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2}) }
function fp(n) { return n == null ? '-' : (Number(n)*100).toFixed(1) + '%' }

function C(props) {
  return React.createElement('div', {className:'cd'},
    React.createElement('div', {className:'ct'}, props.title),
    React.createElement('div', {className:'cv', style: props.accent ? {color: props.accent} : {}}, props.value),
    props.sub ? React.createElement('div', {className:'cs'}, props.sub) : null
  )
}

function Sparkline(props) {
  var data = props.data;            // {ym: revenue, ...}
  var endDate = new Date(props.end + 'T00:00:00');
  var months = [];
  for (var i = 11; i >= 0; i--) {
    var d = new Date(endDate.getFullYear(), endDate.getMonth() - i, 1);
    months.push(d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'));
  }
  var values = months.map(function(ym){ return (data && data[ym]) || 0 });
  var max = Math.max.apply(null, values.concat([0.0001]));
  var w = 78, h = 22, gap = 1;
  var bw = (w - gap * (values.length - 1)) / values.length;
  return React.createElement('svg', {width: w, height: h, viewBox: '0 0 ' + w + ' ' + h, style:{display:'block'}},
    values.map(function(v, idx) {
      var bh = max > 0 ? (v / max) * (h - 1) : 0;
      var x = idx * (bw + gap);
      var y = h - bh;
      var color = v > 0 ? 'var(--ac)' : 'var(--bd)';
      return React.createElement('rect', {key: idx, x: x, y: y, width: bw, height: Math.max(bh, 1), fill: color, opacity: idx === values.length - 1 ? 1 : 0.7});
    })
  );
}

// =========================================================================
// CHART VIEWS — raw SVG, no external deps
// =========================================================================

var CHART_PALETTE = ['#22d3ee','#818cf8','#34d399','#fbbf24','#f87171','#a78bfa','#fb923c','#22c55e','#ec4899','#06b6d4','#84cc16','#f472b6'];

function metricValue(row, metric, allocFor) {
  if (metric === 'real_net' && allocFor) {
    var alloc = allocFor(row.revenue, row.effective_segment);
    return Number(row.revenue || 0) - Number(row.est_cost || 0) - (alloc.total || 0);
  }
  if (metric === 'margin_pct') return row.margin_pct != null ? Number(row.margin_pct) * 100 : 0;
  return Number(row[metric] || 0);
}
function metricFormat(v, metric) {
  if (metric === 'qty') return Number(v).toLocaleString(undefined, {maximumFractionDigits:0});
  if (metric === 'margin_pct') return v.toFixed(1) + '%';
  return fm(v);
}

function ChartView(props) {
  if (props.mode === 'bar')  return React.createElement(BarChart,  props);
  if (props.mode === 'pie')  return React.createElement(PieChart,  props);
  if (props.mode === 'line') return React.createElement(LineChart, props);
  if (props.mode === 'heat') return React.createElement(Heatmap,   props);
  return null;
}

function Heatmap(props) {
  var top = (props.rows || []).slice(0, 30);
  if (!top.length) return React.createElement('div', {className:'ld'}, 'No data to chart.');
  var sparks = props.sparks || {};
  var endDate = new Date(props.end + 'T00:00:00');
  var months = [];
  for (var i = 11; i >= 0; i--) {
    var d = new Date(endDate.getFullYear(), endDate.getMonth() - i, 1);
    months.push(d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'));
  }
  // Find max value across the entire grid for color scaling
  var maxV = 0;
  top.forEach(function(r) {
    var data = sparks[r.dim_label] || {};
    months.forEach(function(m){ var v = Number(data[m] || 0); if (v > maxV) maxV = v });
  });
  if (maxV === 0) return React.createElement('div', {className:'ld'}, 'No revenue across the trailing 12 months.');

  // Color: log-scaled blend from sf2 (cold) → ac (hot)
  function colorFor(v) {
    if (v <= 0) return 'var(--sf2)';
    var t = Math.log(1 + v) / Math.log(1 + maxV);  // 0..1
    // Blend: at t=0, near-bg; at t=1, full ac. Use rgba.
    var alpha = 0.15 + t * 0.85;
    return 'rgba(34, 211, 238, ' + alpha.toFixed(3) + ')';
  }

  var labelW = 280;
  var cellH = 22;
  var cellW = 60;
  var w = labelW + months.length * cellW + 110;
  var h = top.length * cellH + 50;

  return React.createElement('div', {style:{padding:'12px 14px', maxHeight:'70vh', overflow:'auto'}},
    React.createElement('svg', {width: w, height: h, viewBox: '0 0 ' + w + ' ' + h, style:{display:'block'}},
      months.map(function(m, mi) {
        return React.createElement('text', {key:m, x: labelW + mi * cellW + cellW / 2, y: 16, fontSize:9, fill:'var(--mt)', textAnchor:'middle'},
          m.slice(2));
      }),
      top.map(function(r, ri) {
        var y = 28 + ri * cellH;
        var data = sparks[r.dim_label] || {};
        var rowTotal = months.reduce(function(s, m){ return s + Number(data[m] || 0) }, 0);
        return React.createElement('g', {key: r.dim_label},
          React.createElement('text', {x: labelW - 8, y: y + 14, fontSize:11, fill:'var(--tx)', textAnchor:'end'},
            r.dim_label.length > 38 ? r.dim_label.substring(0, 38) + '…' : r.dim_label),
          months.map(function(m, mi) {
            var v = Number(data[m] || 0);
            var x = labelW + mi * cellW;
            return React.createElement('g', {key: m},
              React.createElement('rect', {x: x + 1, y: y + 2, width: cellW - 2, height: cellH - 4, fill: colorFor(v), stroke:'var(--bd)', strokeWidth: 0.5}),
              v > 0 ? React.createElement('text', {x: x + cellW / 2, y: y + 14, fontSize:9, fill:'var(--bg)', textAnchor:'middle', fontWeight: 600},
                v >= 1000 ? Math.round(v/1000) + 'k' : Math.round(v)) : null
            );
          }),
          React.createElement('text', {x: labelW + months.length * cellW + 8, y: y + 14, fontSize:11, fill:'var(--tx)'}, fm(rowTotal))
        );
      })
    )
  );
}

function BarChart(props) {
  var top = (props.rows || []).slice(0, 25);
  if (!top.length) return React.createElement('div', {className:'ld'}, 'No data to chart.');
  var metric = props.metric || 'revenue';
  // paired-bar mode (prior vs current) only valid when metric === 'revenue'
  var showCompare = props.showCompare && metric === 'revenue';
  var values = top.map(function(r){ return metricValue(r, metric, props.allocFor) });
  var maxVal = Math.max.apply(null, values.map(Math.abs).concat(showCompare ? top.map(function(r){ return Math.abs(Number(r.prev_revenue || 0)) }) : [], [1]));
  var hasNeg = values.some(function(v){ return v < 0 });
  var rowH = showCompare ? 28 : 22;
  var labelW = 280;
  var w = 1000, h = top.length * rowH + 30;
  var barAreaW = w - labelW - 100;
  // For metrics that can be negative, draw bars from a center axis; otherwise from labelW.
  var zeroX = labelW + (hasNeg ? barAreaW * 0.5 : 0);
  var halfW = hasNeg ? barAreaW * 0.5 : barAreaW;

  return React.createElement('div', {style:{padding:'12px 14px', maxHeight:'70vh', overflow:'auto'}},
    React.createElement('svg', {width: w, height: h, viewBox: '0 0 ' + w + ' ' + h, style:{display:'block'}},
      hasNeg ? React.createElement('line', {x1: zeroX, y1: 0, x2: zeroX, y2: h, stroke:'var(--bd)', strokeWidth: 1}) : null,
      top.map(function(r, idx) {
        var y = idx * rowH + 6;
        var v = values[idx];
        var prev = Number(r.prev_revenue || 0);
        var bw = Math.abs(v) / maxVal * halfW;
        var bx = v >= 0 ? zeroX : zeroX - bw;
        var prevW = Math.abs(prev) / maxVal * halfW;
        var color = v >= 0 ? 'var(--ac)' : 'var(--rd)';
        return React.createElement('g', {key: r.dim_label},
          React.createElement('text', {x: labelW - 8, y: y + (showCompare ? 14 : 13), fill:'var(--tx)', fontSize: 11, textAnchor:'end'},
            r.dim_label.length > 38 ? r.dim_label.substring(0, 38) + '…' : r.dim_label),
          showCompare ? React.createElement('rect', {x: zeroX, y: y, width: prevW, height: 9, fill:'var(--mt)', opacity: 0.6}) : null,
          React.createElement('rect', {x: bx, y: showCompare ? y + 11 : y + 4, width: bw, height: 12, fill: color}),
          React.createElement('text', {x: Math.max(bx + bw, zeroX + prevW) + 6, y: y + (showCompare ? 17 : 14), fill:'var(--tx)', fontSize: 11},
            metricFormat(v, metric) + (showCompare && prev ? '  (was ' + fm(prev) + ')' : ''))
        );
      })
    )
  );
}

function PieChart(props) {
  var metric = props.metric || 'revenue';
  var top = (props.rows || []).slice(0, 12);
  if (!top.length) return React.createElement('div', {className:'ld'}, 'No data to chart.');
  var rest = (props.rows || []).slice(12);
  var slices = top.map(function(r) {
    return Object.assign({}, r, { __value: metricValue(r, metric, props.allocFor) });
  }).filter(function(r){ return r.__value > 0 });  // pie only renders positive values
  if (rest.length) {
    var otherV = rest.reduce(function(s, r){ return s + Math.max(0, metricValue(r, metric, props.allocFor)) }, 0);
    if (otherV > 0) slices.push({dim_label: '+ ' + rest.length + ' more', __value: otherV});
  }
  var total = slices.reduce(function(s, r){ return s + r.__value }, 0);
  if (total === 0) return React.createElement('div', {className:'ld'}, 'All values zero or negative — nothing to chart for this metric.');
  var cx = 220, cy = 220, r = 180;
  var startAngle = -Math.PI / 2;
  var paths = slices.map(function(row, idx) {
    var v = row.__value;
    var pct = v / total;
    var endAngle = startAngle + pct * Math.PI * 2;
    var large = pct > 0.5 ? 1 : 0;
    var x1 = cx + Math.cos(startAngle) * r;
    var y1 = cy + Math.sin(startAngle) * r;
    var x2 = cx + Math.cos(endAngle) * r;
    var y2 = cy + Math.sin(endAngle) * r;
    var d = ['M', cx, cy, 'L', x1, y1, 'A', r, r, 0, large, 1, x2, y2, 'Z'].join(' ');
    var midAngle = (startAngle + endAngle) / 2;
    var labelX = cx + Math.cos(midAngle) * (r * 0.65);
    var labelY = cy + Math.sin(midAngle) * (r * 0.65);
    var color = CHART_PALETTE[idx % CHART_PALETTE.length];
    var elem = {d: d, color: color, label: row.dim_label, value: v, pct: pct, labelX: labelX, labelY: labelY};
    startAngle = endAngle;
    return elem;
  });

  return React.createElement('div', {style:{padding:'12px 14px', display:'flex', gap:24, flexWrap:'wrap'}},
    React.createElement('svg', {width: 460, height: 460, viewBox:'0 0 460 460'},
      paths.map(function(p, i) {
        return React.createElement('g', {key: i},
          React.createElement('path', {d: p.d, fill: p.color, stroke:'var(--bg)', strokeWidth: 2, opacity: 0.92}),
          p.pct >= 0.05 ? React.createElement('text', {x: p.labelX, y: p.labelY, fill:'var(--bg)', fontSize: 11, fontWeight: 700, textAnchor:'middle'},
            (p.pct * 100).toFixed(0) + '%') : null
        );
      })
    ),
    React.createElement('div', {style:{flex:'1 1 280px', minWidth: 240}},
      React.createElement('div', {className:'ct', style:{marginBottom: 8}}, 'LEGEND'),
      paths.map(function(p, i) {
        return React.createElement('div', {key: i, style:{display:'flex', alignItems:'center', gap: 8, padding:'4px 0', fontSize: 12, borderBottom:'1px solid var(--bd)'}},
          React.createElement('span', {style:{display:'inline-block', width: 12, height: 12, background: p.color, borderRadius: 2}}),
          React.createElement('span', {style:{flex: 1, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}}, p.label),
          React.createElement('span', {className:'mn', style:{color:'var(--mt)'}}, metricFormat(p.value, metric)),
          React.createElement('span', {className:'mn', style:{minWidth: 50, textAlign:'right'}}, (p.pct * 100).toFixed(1) + '%')
        );
      })
    )
  );
}

function LineChart(props) {
  var top = (props.rows || []).slice(0, 8);
  if (!top.length) return React.createElement('div', {className:'ld'}, 'No data to chart.');
  var sparks = props.sparks || {};
  var endDate = new Date(props.end + 'T00:00:00');
  var months = [];
  for (var i = 11; i >= 0; i--) {
    var d = new Date(endDate.getFullYear(), endDate.getMonth() - i, 1);
    months.push(d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'));
  }
  var series = top.map(function(r) {
    var data = sparks[r.dim_label] || {};
    return { label: r.dim_label, values: months.map(function(ym){ return Number(data[ym] || 0) }) };
  });
  var maxY = Math.max.apply(null, series.flatMap(function(s){ return s.values }).concat([1]));
  var w = 980, h = 360;
  var padL = 70, padR = 20, padT = 16, padB = 50;
  var chartW = w - padL - padR;
  var chartH = h - padT - padB;
  function x(i) { return padL + (i / (months.length - 1)) * chartW }
  function y(v) { return padT + chartH - (v / maxY) * chartH }

  return React.createElement('div', {style:{padding:'12px 14px'}},
    React.createElement('svg', {width: w, height: h, viewBox: '0 0 ' + w + ' ' + h, style:{display:'block'}},
      // y-axis grid (4 lines)
      [0, 0.25, 0.5, 0.75, 1].map(function(frac, i) {
        var v = maxY * (1 - frac);
        var yy = padT + frac * chartH;
        return React.createElement('g', {key: i},
          React.createElement('line', {x1: padL, y1: yy, x2: w - padR, y2: yy, stroke:'var(--bd)', strokeWidth: 1, opacity: 0.5}),
          React.createElement('text', {x: padL - 6, y: yy + 4, fontSize: 10, fill:'var(--mt)', textAnchor:'end'}, fm(v))
        );
      }),
      // x-axis labels
      months.map(function(m, i) {
        return React.createElement('text', {key: i, x: x(i), y: h - padB + 16, fontSize: 9, fill:'var(--mt)', textAnchor:'middle'}, m.slice(2));
      }),
      // series lines
      series.map(function(s, sidx) {
        var color = CHART_PALETTE[sidx % CHART_PALETTE.length];
        var path = s.values.map(function(v, i){ return (i === 0 ? 'M' : 'L') + x(i) + ' ' + y(v) }).join(' ');
        return React.createElement('g', {key: sidx},
          React.createElement('path', {d: path, fill:'none', stroke: color, strokeWidth: 2}),
          s.values.map(function(v, i) {
            return React.createElement('circle', {key: i, cx: x(i), cy: y(v), r: 3, fill: color});
          })
        );
      })
    ),
    React.createElement('div', {style:{display:'flex', flexWrap:'wrap', gap: 12, marginTop: 8, fontSize: 11}},
      series.map(function(s, idx) {
        var color = CHART_PALETTE[idx % CHART_PALETTE.length];
        return React.createElement('div', {key: idx, style:{display:'flex', alignItems:'center', gap: 6}},
          React.createElement('span', {style:{display:'inline-block', width: 14, height: 3, background: color}}),
          React.createElement('span', null, s.label.length > 32 ? s.label.substring(0, 32) + '…' : s.label)
        );
      })
    )
  );
}

// =========================================================================
// STACKED-BAR VIEW — primary dim split by a secondary dim (e.g. customer × segment)
// =========================================================================

var STACK_DIMS = [
  {id:'segment',  label:'Segment'},
  {id:'channel',  label:'Channel'},
  {id:'category', label:'Category'},
  {id:'sales_rep',label:'Sales Rep'},
  {id:'entity',   label:'Entity'},
  {id:'month',    label:'Month'}
];

function StackedView(props) {
  var stackByState = React.useState('segment');
  var stackBy = stackByState[0], setStackBy = stackByState[1];
  var rState = React.useState(null);
  var data = rState[0], setData = rState[1];   // [{dim_label, stack_label, revenue}, ...]
  var loadingState = React.useState(false);
  var loading = loadingState[0], setLoading = loadingState[1];
  var modeState = React.useState('absolute');   // 'absolute' | 'percent'
  var mode = modeState[0], setMode = modeState[1];

  var dim = props.dim;
  // If primary and stack are the same, default stack to segment (or category if dim was segment)
  var effectiveStack = stackBy === dim ? (dim === 'segment' ? 'category' : 'segment') : stackBy;

  React.useEffect(function() {
    setLoading(true);
    sbrpc('fn_sales_stacked', {
      p_dim: dim, p_stack: effectiveStack,
      p_start: props.start, p_end: props.end,
      p_entities:    props.entities && props.entities.length    ? props.entities : null,
      p_categories:  props.categories && props.categories.length ? props.categories : null,
      p_customers:   props.customers && props.customers.length  ? props.customers : null,

function defaultPeriods(preset) {
  var now = new Date();
  var y = now.getFullYear();
  var m = now.getMonth();
  function ymd(d) { return d.toISOString().slice(0,10) }
  function startOfMonth(yr, mo) { return ymd(new Date(yr, mo, 1)) }
  function endOfMonth(yr, mo) { return ymd(new Date(yr, mo + 1, 0)) }
  function startOfQuarter(yr, qIdx) { return startOfMonth(yr, qIdx * 3) }
  function endOfQuarter(yr, qIdx) { return endOfMonth(yr, qIdx * 3 + 2) }
  if (preset === 'yearly') {
    return [
      {label: String(y - 2),       start: y - 2 + '-01-01', end: y - 2 + '-12-31'},
      {label: String(y - 1),       start: y - 1 + '-01-01', end: y - 1 + '-12-31'},
      {label: String(y) + ' YTD', start: y + '-01-01',     end: ymd(now)}
    ];
  }
  if (preset === 'quarterly') {
    var out = [];
    var qNow = Math.floor(m / 3);
    for (var i = 3; i >= 0; i--) {
      var dq = qNow - i;
      var yr = y, q = dq;
      while (q < 0) { q += 4; yr -= 1; }
      out.push({label: yr + ' Q' + (q + 1), start: startOfQuarter(yr, q), end: i === 0 ? ymd(now) : endOfQuarter(yr, q)});
    }
    return out;
  }
  // monthly: last 6 months
  var out = [];
  for (var i = 5; i >= 0; i--) {
    var dm = m - i;
    var yr2 = y;
    while (dm < 0) { dm += 12; yr2 -= 1; }
    out.push({label: yr2 + '-' + String(dm + 1).padStart(2, '0'), start: startOfMonth(yr2, dm), end: i === 0 ? ymd(now) : endOfMonth(yr2, dm)});
  }
  return out;
}

  {slug:'sync-qbo',           label:'QBO Invoices + P&L', desc:'Pulls Invoices and P&L snapshots. Nightly cron.'},
  {slug:'sync-qbo-items',     label:'QBO Items',          desc:'Pulls Item master + PurchaseCost. Powers est_cost.'},
  {slug:'sync-qbo-customers', label:'QBO Customers',      desc:'Pulls Customer master + CustomerType for channel mapping.'},
  {slug:'sync-qbo-employees', label:'QBO Employees',      desc:'Mirrors QBO Payroll employee list to ops.qbo_employees_cache.'},
  {slug:'sync-sf',            label:'ServiceFusion Jobs', desc:'Delivery + service jobs. Every 30 min.'}
];

function SyncPanel() {
  var tState = React.useState(null);
  var tok = tState[0], setTok = tState[1];
  var rState = React.useState({});
  var running = rState[0], setRunning = rState[1];
  var msgState = React.useState({});
  var msg = msgState[0], setMsg = msgState[1];
  var lState = React.useState(null);
  var logs = lState[0], setLogs = lState[1];

  function load() {
    Promise.all([
      sbq('v_qbo_token_status', 'select=*'),
      sbq('sync_log', 'select=function_name,status,started_at,finished_at,note&order=started_at.desc&limit=20')
    ]).then(function(res) {
      setTok((res[0] || [])[0] || null);
      setLogs(res[1] || []);
    });
  }
  React.useEffect(load, []);

  function trigger(slug) {
    setRunning(function(p){ var n = Object.assign({}, p); n[slug] = true; return n });
    setMsg(function(p){ var n = Object.assign({}, p); n[slug] = 'running…'; return n });
    fetch(SB_URL + '/functions/v1/' + slug, {
      method:'POST', headers:{ 'apikey':SB_KEY, 'Authorization':'Bearer '+SB_KEY }
    }).then(function(r){ return r.json() })
      .then(function(j) {
        var summary;
        if (j.ok) {
          summary = 'OK';
          if (j.synced != null) summary += ' · ' + j.synced + ' synced';
          if (j.upserted != null && j.upserted !== j.synced) summary += ' / ' + j.upserted + ' upserted';
          if (j.with_purchase_cost != null) summary += ' · ' + j.with_purchase_cost + ' w/cost';
          if (j.with_qbo_type != null) summary += ' · ' + j.with_qbo_type + ' w/type';
          if (j.duration_ms) summary += ' · ' + j.duration_ms + 'ms';
        } else {
          summary = 'FAIL: ' + (j.error || 'unknown');
        }
        setMsg(function(p){ var n = Object.assign({}, p); n[slug] = summary; return n });
        load();
      })
      .catch(function(e) {
        setMsg(function(p){ var n = Object.assign({}, p); n[slug] = 'ERROR: ' + e.message; return n });
      })
      .finally(function() {
        setRunning(function(p){ var n = Object.assign({}, p); delete n[slug]; return n });
      });
  }

  function fmtAge(ts) {
    if (!ts) return '—';
    var d = new Date(ts);
    var min = Math.round((Date.now() - d.getTime()) / 60000);
    if (min < 60) return min + 'm ago';
    if (min < 1440) return Math.round(min/60) + 'h ago';
    return Math.round(min/1440) + 'd ago';
  }

  return React.createElement('div', null,
    React.createElement('div', {className:'cd', style:{marginBottom:10}},
      React.createElement('div', {className:'ct'}, 'QBO TOKEN STATUS — REALM ' + (tok ? tok.realm_id : '—')),
      tok ? React.createElement('div', {style:{fontSize:11, color:'var(--mt)', lineHeight:1.7}},
        'Access token expires: ' + new Date(tok.access_token_expires_at).toLocaleString(),
        React.createElement('br'),
        'Refresh token expires: ' + new Date(tok.refresh_token_expires_at).toLocaleString(),
        React.createElement('br'),
        'Refresh count: ' + tok.refresh_count + ' · last by: ' + (tok.last_refreshed_by || '—'),
        tok.last_error ? React.createElement('div', {style:{color:'var(--rd)', marginTop:6}}, 'Last error: ' + tok.last_error) : null
      ) : React.createElement('div', {style:{color:'var(--mt)', fontSize:11}}, 'Loading…')
    ),
    React.createElement('div', {className:'cd', style:{padding:0, marginBottom:10}},
      React.createElement('div', {style:{padding:'10px 14px', borderBottom:'1px solid var(--bd)'}},
        React.createElement('div', {className:'ct', style:{margin:0}}, 'EDGE FUNCTIONS')
      ),
      React.createElement('table', null,
        React.createElement('thead', null, React.createElement('tr', null,
          React.createElement('th', null, 'Function'),
          React.createElement('th', null, 'Description'),
          React.createElement('th', null, 'Last Result'),
          React.createElement('th', {style:{textAlign:'right'}}, '')
        )),
        React.createElement('tbody', null, SYNC_FUNCTIONS.map(function(fn) {
          var lastLog = (logs || []).find(function(l){ return l.function_name === fn.slug });
          return React.createElement('tr', {key:fn.slug},
            React.createElement('td', null,
              React.createElement('div', {style:{fontWeight:600}}, fn.label),
              React.createElement('div', {style:{fontSize:10, color:'var(--mt)'}}, fn.slug)
            ),
            React.createElement('td', {style:{fontSize:11, color:'var(--mt)'}}, fn.desc),
            React.createElement('td', {style:{fontSize:11}},
              msg[fn.slug] ? React.createElement('div', null, msg[fn.slug]) : null,
              lastLog ? React.createElement('div', {style:{color:'var(--mt)', fontSize:10}}, lastLog.status + ' · ' + fmtAge(lastLog.finished_at || lastLog.started_at)) : null
            ),
            React.createElement('td', {style:{textAlign:'right'}},
              React.createElement('button', {onClick: function(){ trigger(fn.slug) }, disabled: !!running[fn.slug], style:btnPrimary()}, running[fn.slug] ? '…' : 'RUN')
            )
          );
        }))
      )
    ),
    React.createElement(PushBackPanel)
  );
}

function PushBackPanel() {
  var rState = React.useState(null);
  var result = rState[0], setResult = rState[1];
  var bState = React.useState(false);
  var busy = bState[0], setBusy = bState[1];

  function call(commit) {
    setBusy(true); setResult(null);
    fetch(SB_URL + '/functions/v1/push-qbo-customer-types', {
      method:'POST',
      headers:{ 'apikey':SB_KEY, 'Authorization':'Bearer '+SB_KEY, 'Content-Type':'application/json' },
      body: JSON.stringify({ commit: !!commit })
    }).then(function(r){ return r.json() })
      .then(function(j){ setResult(j); setBusy(false) })
      .catch(function(e){ setResult({ok:false, error:e.message}); setBusy(false) });
  }

  return React.createElement('div', {className:'cd'},
    React.createElement('div', {className:'ct'}, 'PUSH PRIMARY CHANNELS TO QBO'),
    React.createElement('div', {style:{fontSize:11, color:'var(--mt)', lineHeight:1.6, marginBottom:12}},
      'Writes each customer’s primary channel into Customer.CustomerType in QBO so the classification shows up there too. CustomerTypes are created automatically if they don’t already exist.',
      React.createElement('br'),
      'Sales-rep push back is a separate slice (QBO doesn’t have a built-in rep field on Customer; needs a CustomField mapping or Class on transactions — still TBD).'
    ),
    React.createElement('div', {style:{display:'flex', gap:8, marginBottom:10}},
      React.createElement('button', {onClick: function(){ call(false) }, disabled: busy,
        style: btnSecondary()}, busy ? '…' : 'DRY RUN (PREVIEW)'),
      React.createElement('button', {onClick: function(){ if (!confirm('Commit changes to QBO? This will UPDATE customer records.')) return; call(true) }, disabled: busy,
        style: Object.assign({}, btnPrimary(), {background:'var(--am)', borderColor:'var(--am)'})}, 'COMMIT TO QBO')
    ),
    result ? React.createElement('div', {style:{padding:'10px 12px', background:'var(--sf2)', border:'1px solid var(--bd)', borderRadius:4, fontSize:11, fontFamily:'monospace', whiteSpace:'pre-wrap', maxHeight:240, overflow:'auto'}},
      JSON.stringify(result, null, 2)) : null
  );
}

function LoginScreen(props) {
  var eState = React.useState('');
  var email = eState[0], setEmail = eState[1];
  var pState = React.useState('');
  var password = pState[0], setPassword = pState[1];
  var bState = React.useState(false);
  var busy = bState[0], setBusy = bState[1];
  var msgState = React.useState('');
  var msg = msgState[0], setMsg = msgState[1];

  function submit(e) {
    e && e.preventDefault();
    if (!email || !password) return;
    setBusy(true); setMsg('');
    sbAuth.auth.signInWithPassword({ email: email.trim(), password: password })
      .then(function(res) {
        if (res.error) { setMsg(res.error.message); setBusy(false); }
        else { props.onLogin && props.onLogin(res.data.session); }
      })
      .catch(function(err) { setMsg(err.message || String(err)); setBusy(false); });
  }

  return React.createElement('div', {style:{minHeight:'100vh', display:'flex', alignItems:'center', justifyContent:'center', padding:20}},
    React.createElement('form', {onSubmit: submit, className:'cd', style:{width:380, maxWidth:'100%', padding:'24px 28px'}},

      React.createElement('label', {style:{display:'block', fontSize:10, color:'var(--mt)', textTransform:'uppercase', letterSpacing:1, marginBottom:4}}, 'Password'),

          'These per-account monthly totals are what QBO Budget would receive. Use EXPORT BUDGET CSV above to import into QBO Budget UI (QBO Budget API write requires Plus tier; we can wire that up when ready).')
      ),
      rollup.length === 0
        ? React.createElement('div', {className:'ld'}, 'Add lines above to see the rollup.')
        : React.createElement('div', {style:{overflow:'auto'}},
            React.createElement('table', null,
              React.createElement('thead', null, React.createElement('tr', null,
                React.createElement('th', null, 'Account'),
                MONTHS_SHORT.map(function(m){ return React.createElement('th', {key:m, style:{textAlign:'right', fontSize:9}}, m) }),
                React.createElement('th', {style:{textAlign:'right'}}, 'Total')
              )),
              React.createElement('tbody', null, rollup.map(function(r) {
                return React.createElement('tr', {key: r.qbo_account_id || r.account_name},
                  React.createElement('td', {style:{fontWeight:600}}, r.account_name),
                  ['m1','m2','m3','m4','m5','m6','m7','m8','m9','m10','m11','m12'].map(function(k, i) {
                    return React.createElement('td', {key:i, className:'mn', style:{textAlign:'right'}}, fm(r[k]));
                  }),
                  React.createElement('td', {className:'mn', style:{textAlign:'right', fontWeight:600}}, fm(r.total))
                );
              }))
            )
          )
    )
  );
}

function App() {
  var sessState = React.useState(undefined);
  var session = sessState[0], setSession = sessState[1];

  React.useEffect(function() {
    // If served through the apbg-gateway proxy, the gateway has already
    // signed the user in and stored a session under 'apbg_session' in
    // localStorage. Bootstrap the dashboard's Supabase session from it
    // so users don't see a second login screen.
    try {
      var raw = localStorage.getItem('apbg_session');
      if (raw) {
        var g = JSON.parse(raw);
        var exp = g && g.expiresAt;
        var notExpired = exp && (
          typeof exp === 'number' ? exp * 1000 > Date.now() : Date.parse(exp) > Date.now()
        );
        if (g && g.token && g.refreshToken && notExpired) {
          sbAuth.auth.setSession({ access_token: g.token, refresh_token: g.refreshToken });
        }
      }
    } catch (e) {}

    sbAuth.auth.getSession().then(function(res) { setSession(res.data.session || null) });
    var sub = sbAuth.auth.onAuthStateChange(function(_evt, s) { setSession(s || null) });
    return function(){ sub.data && sub.data.subscription && sub.data.subscription.unsubscribe() };
  }, []);

  if (session === undefined) {
    return React.createElement('div', {className:'ld', style:{minHeight:'100vh'}}, 'Loading\u2026');
  }
  if (session === null) {
    return React.createElement(LoginScreen, {onLogin: function(s){ setSession(s) }});
  }
  return React.createElement(MainApp, {session: session, onLogout: function(){ sbAuth.auth.signOut().then(function(){ setSession(null) }) }});
}

function MainApp(props) {
  var validViews = ['margin', 'customers', 'reports', 'plans', 'settings'];
  function viewFromHash() {
    var h = (window.location.hash || '').replace(/^#/, '').split('?')[0];
    return validViews.indexOf(h) >= 0 ? h : 'margin';
  }
  var vState = React.useState(viewFromHash);
  var view = vState[0], setView = vState[1];

  React.useEffect(function() {
    function onHash() { setView(viewFromHash()) }
    window.addEventListener('hashchange', onHash);
    return function(){ window.removeEventListener('hashchange', onHash) };
  }, []);

  function navTo(id) {
    if (id === view) return;
    if (window.location.hash !== '#' + id) {
      window.history.replaceState(null, '', '#' + id);
    }
    setView(id);
  }

  function tab(id, label) {
    var on = view === id;
    return React.createElement('a', {
      key:id, href:'#' + id, onClick: function(e){ e.preventDefault(); navTo(id) },
      style:{
        textDecoration:'none',
        background: on ? 'var(--ac)' : 'transparent',
        color: on ? 'var(--bg)' : 'var(--tx)',
        border:'1px solid ' + (on ? 'var(--ac)' : 'var(--bd)'),
        padding:'5px 12px', borderRadius:4, fontSize:11, fontWeight: on ? 700 : 500,
        letterSpacing:.5, marginRight:6
      }
    }, label);
  }

  var content = view === 'customers' ? React.createElement(CustomersPage)
              : view === 'reports'   ? React.createElement(ReportsPage)
              : view === 'plans'     ? React.createElement(PlansPage)
              : view === 'settings'  ? React.createElement(SettingsPage)
              : React.createElement(MarginPage);

  var userEmail = props.session && props.session.user && props.session.user.email;

  return React.createElement(React.Fragment, null,
    React.createElement('div', {className:'tb'},
      React.createElement('div', {className:'lg'}, 'PACER \u00b7 MARGIN ANALYTICS',
        React.createElement('small', null, 'Sales \u00b7 Customers \u00b7 Items \u00b7 Margin')
      ),
      React.createElement('div', {style:{display:'flex', alignItems:'center', gap:10}},
        tab('margin', 'MARGIN'), tab('customers', 'CUSTOMERS'), tab('reports', 'REPORTS'), tab('plans', 'PLANS'), tab('settings', 'SETTINGS'),
        React.createElement('span', {style:{fontSize:10, color:'var(--mt)', marginLeft:6}}, userEmail || ''),
        React.createElement('button', {onClick: props.onLogout,
          style:{background:'transparent', color:'var(--mt)', border:'1px solid var(--bd)', padding:'4px 9px', borderRadius:4, fontSize:10, cursor:'pointer', letterSpacing:.5}},
          'SIGN OUT')
      )
    ),
    React.createElement('div', {className:'ma'}, content)
  )
}

ReactDOM.render(React.createElement(App), document.getElementById('root'));
</script>
</body>
</html>
