const sbAuth = supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: true, autoRefreshToken: true } });

async function sbq(tbl, params) {
  var url = SB_URL + '/rest/v1/' + tbl;
  if (params) url = url + '?' + params;
  var res = await fetch(url, {
    headers: { 'apikey': SB_KEY, 'Accept-Profile': 'ops', 'Content-Type': 'application/json' }
  });
  if (!res.ok) return [];
  return res.json();
}

async function _sbToken() {
  try {
    var s = await sbAuth.auth.getSession();
    return (s && s.data && s.data.session && s.data.session.access_token) || SB_KEY;
  } catch (e) { return SB_KEY; }
}

async function sbrpc(fn, args) {
  var token = await _sbToken();
  var res = await fetch(SB_URL + '/rest/v1/rpc/' + fn, {
    method: 'POST',
    headers: {
      'apikey': SB_KEY,
      'Authorization': 'Bearer ' + token,
      'Content-Profile': 'ops',
      'Content-Type': 'application/json'
    },
    body: JSON.stringify(args || {})
  });
  if (!res.ok) { console.error('rpc ' + fn, res.status, await res.text()); return []; }
  return res.json();
}

async function sbWriteHeaders() {
  var token = await _sbToken();
  return {
    'apikey': SB_KEY,
    'Authorization': 'Bearer ' + token,
    'Content-Profile': 'ops',
    'Accept-Profile': 'ops',
    'Content-Type': 'application/json',
    'Prefer': 'return=representation'
  };
}
async function sbInsert(table, row) {
  var headers = await sbWriteHeaders();
  var res = await fetch(SB_URL + '/rest/v1/' + table, { method: 'POST', headers: headers, body: JSON.stringify(row) });
  if (!res.ok) { console.error('insert', table, res.status, await res.text()); return null; }
  return res.json();
}
async function sbUpdate(table, where, patch) {
  var headers = await sbWriteHeaders();
  var res = await fetch(SB_URL + '/rest/v1/' + table + '?' + where, { method: 'PATCH', headers: headers, body: JSON.stringify(patch) });
  if (!res.ok) { console.error('update', table, res.status, await res.text()); return null; }
  return res.json();
}
async function sbDelete(table, where) {
  var headers = await sbWriteHeaders();
  var res = await fetch(SB_URL + '/rest/v1/' + table + '?' + where, { method: 'DELETE', headers: headers });
  if (!res.ok) { console.error('delete', table, res.status, await res.text()); return false; }
  return true;
}

function fm(n) { return n == null ? '-' : '$' + Number(n).toLocaleString('en-US', {maximumFractionDigits:0}) }
function fd(n) { return n == null ? '-' : '$' + Number(n).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2}) }
function fp(n) { return n == null ? '-' : (Number(n)*100).toFixed(1) + '%' }

  )
}

function Sparkline(props) {
  var data = props.data;            // {ym: revenue, ...}
  var endDate = new Date(props.end + 'T00:00:00');
  var months = [];
  for (var i = 11; i >= 0; i--) {
    var d = new Date(endDate.getFullYear(), endDate.getMonth() - i, 1);
    months.push(d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'));
  }
  var values = months.map(function(ym){ return (data && data[ym]) || 0 });
  var max = Math.max.apply(null, values.concat([0.0001]));
  var w = 78, h = 22, gap = 1;
  var bw = (w - gap * (values.length - 1)) / values.length;
  return React.createElement('svg', {width: w, height: h, viewBox: '0 0 ' + w + ' ' + h, style:{display:'block'}},
    values.map(function(v, idx) {
      var bh = max > 0 ? (v / max) * (h - 1) : 0;
      var x = idx * (bw + gap);
      var y = h - bh;
      var color = v > 0 ? 'var(--ac)' : 'var(--bd)';
      return React.createElement('rect', {key: idx, x: x, y: y, width: bw, height: Math.max(bh, 1), fill: color, opacity: idx === values.length - 1 ? 1 : 0.7});
    })
  );
}

function grandTotalRow(rows, totRev, showOH, showCompare, allocBuckets, allocFor) {
  var t = {line_count:0, qty:0, revenue:0, est_cost:0, est_margin:0, prev_revenue:0, delta_revenue:0};
  var hasCost = false, hasPrev = false;
  rows.forEach(function(r) {
    t.line_count += Number(r.line_count || 0);
    t.qty += Number(r.qty || 0);
    t.revenue += Number(r.revenue || 0);
    if (r.est_cost != null) { t.est_cost += Number(r.est_cost); hasCost = true; }
    if (r.est_margin != null) t.est_margin += Number(r.est_margin);
    if (r.prev_revenue != null) { t.prev_revenue += Number(r.prev_revenue); hasPrev = true; }
    if (r.delta_revenue != null) t.delta_revenue += Number(r.delta_revenue);
  });
  var marginPct = t.revenue > 0 && hasCost ? (t.revenue - t.est_cost) / t.revenue : null;
  var avgPrice = t.qty > 0 ? t.revenue / t.qty : null;
  var deltaPct = hasPrev && t.prev_revenue !== 0 ? (t.revenue - t.prev_revenue) / t.prev_revenue : null;
  // Sum of per-row allocations is the "true" total OH for the visible rows.
  var allocTotal = 0;
  var byBucket = {};
  if (showOH) {
    rows.forEach(function(r) {
      var a = allocFor(r.revenue, r.effective_segment);
      allocTotal += a.total || 0;
      allocBuckets.forEach(function(b){ byBucket[b.bucket_code] = (byBucket[b.bucket_code] || 0) + (a[b.bucket_code] || 0) });
    });
  }
  var realNet = showOH ? (t.revenue - t.est_cost - allocTotal) : null;
  var realPct = showOH && t.revenue > 0 ? realNet / t.revenue : null;
  var bg = {background:'var(--sf2)', fontWeight:700, borderTop:'2px solid var(--ac)', borderBottom:'2px solid var(--bd)'};
  return React.createElement('tr', {key:'__total', style: bg},
    React.createElement('td', null, 'TOTAL (' + rows.length + ')'),
    React.createElement('td', null, ''),
    React.createElement('td', {className:'mn', style:{textAlign:'right'}}, Number(t.line_count).toLocaleString()),
    React.createElement('td', {className:'mn', style:{textAlign:'right'}}, Number(t.qty).toLocaleString(undefined, {maximumFractionDigits:1})),
    React.createElement('td', {className:'mn', style:{textAlign:'right'}}, fm(t.revenue)),
    React.createElement('td', {className:'mn', style:{textAlign:'right', color:'var(--mt)'}}, '100.0%'),
    React.createElement('td', {className:'mn', style:{textAlign:'right'}}, avgPrice != null ? fd(avgPrice) : '-'),
    showCompare ? React.createElement('td', {className:'mn', style:{textAlign:'right', borderLeft:'1px solid var(--bd)', color:'var(--mt)'}}, hasPrev ? fm(t.prev_revenue) : '—') : null,
    showCompare ? React.createElement('td', {className:'mn', style:{textAlign:'right', color: t.delta_revenue >= 0 ? 'var(--gn)' : 'var(--rd)'}}, hasPrev ? (t.delta_revenue >= 0 ? '+' : '') + fm(t.delta_revenue) : '—') : null,
    showCompare ? React.createElement('td', {className:'mn', style:{textAlign:'right', color: deltaPct == null ? 'var(--mt)' : (deltaPct >= 0 ? 'var(--gn)' : 'var(--rd)')}}, deltaPct != null ? (deltaPct >= 0 ? '+' : '') + fp(deltaPct) : '—') : null,
    React.createElement('td', {className:'mn', style:{textAlign:'right', borderLeft:'1px solid var(--bd)'}}, hasCost ? fm(t.est_cost) : '—'),
    React.createElement('td', {className:'mn', style:{textAlign:'right'}}, hasCost ? fm(t.est_margin) : '—'),
    React.createElement('td', {className:'mn', style:{textAlign:'right', color: marginPct == null ? 'var(--mt)' : (marginPct >= 0.4 ? 'var(--gn)' : (marginPct >= 0 ? 'var(--am)' : 'var(--rd)'))}}, marginPct != null ? fp(marginPct) : '—'),
    showOH ? allocBuckets.map(function(b) {
      return React.createElement('td', {key:b.bucket_code, className:'mn', style:{textAlign:'right', borderLeft:'1px solid var(--bd)', color:'var(--mt)'}}, fm(byBucket[b.bucket_code] || 0));
    }) : null,
    showOH ? React.createElement('td', {className:'mn', style:{textAlign:'right', borderLeft:'1px solid var(--bd)', color: realNet >= 0 ? 'var(--gn)' : 'var(--rd)'}}, fm(realNet)) : null,
    showOH ? React.createElement('td', {className:'mn', style:{textAlign:'right', color: realPct == null ? 'var(--mt)' : (realPct >= 0 ? 'var(--gn)' : 'var(--rd)')}}, realPct != null ? fp(realPct) : '—') : null
  );
}

function MultiPicker(props) {
  var qState = React.useState('');
  var query = qState[0], setQuery = qState[1];
  var oState = React.useState(false);
  var open = oState[0], setOpen = oState[1];
  var wrapRef = React.useRef(null);

  React.useEffect(function() {
    if (!open) return;
    function onDoc(e) {
      if (wrapRef.current && !wrapRef.current.contains(e.target)) setOpen(false);
    }
    document.addEventListener('mousedown', onDoc);
    return function() { document.removeEventListener('mousedown', onDoc) };
  }, [open]);

  function pick(m) {
    if (!m) return;
    props.onAdd(m);
    setQuery('');
  }

  var q = query.toLowerCase();
  var selectedSet = {};
  (props.selected || []).forEach(function(s) { selectedSet[s] = true });
  var matches = (props.options || []).filter(function(opt) {
    if (selectedSet[opt]) return false;
    if (!q) return true;
    return opt && opt.toLowerCase().indexOf(q) >= 0;
  });
  var truncated = matches.length > 80;
  var shown = matches.slice(0, 80);
  var optionsLoaded = (props.options || []).length > 0;

  return React.createElement('div', {style:{display:'flex', alignItems:'flex-start', gap:8}},
    React.createElement('span', {style:{color:'var(--mt)', textTransform:'uppercase', letterSpacing:1, fontSize:10, minWidth:70, paddingTop:6}}, props.label + (props.selected && props.selected.length ? ' (' + props.selected.length + ')' : '')),
    React.createElement('div', {ref: wrapRef, style:{flex:1, position:'relative'}},
      React.createElement('div', {style:{display:'flex', flexWrap:'wrap', gap:4, alignItems:'center', minHeight:28, background:'var(--sf2)', border:'1px solid var(--bd)', borderRadius:4, padding:'3px 6px', cursor:'text'}, onClick: function(e) {
          var inp = e.currentTarget.querySelector('input'); if (inp) inp.focus();
        }},
        (props.selected || []).map(function(v) {
          return React.createElement('span', {key:v, style:{background:'var(--bg)', border:'1px solid var(--bd)', padding:'2px 7px', borderRadius:10, fontSize:11, display:'inline-flex', alignItems:'center', gap:5, maxWidth:'100%'}},
            React.createElement('span', {style:{whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis', maxWidth:280}}, v),
            React.createElement('span', {role:'button', style:{cursor:'pointer', color:'var(--mt)', fontWeight:700}, onClick: function(e) { e.stopPropagation(); props.onRemove(v) }}, '×')
          );
        }),
        React.createElement('input', {
          type:'text',
          value: query,
          onChange: function(e) { setQuery(e.target.value); setOpen(true) },
          onFocus: function() { setOpen(true) },
          onKeyDown: function(e) {
            if (e.key === 'Escape') { setOpen(false); }
            else if (e.key === 'Enter') { e.preventDefault(); if (shown.length) pick(shown[0]); }
            else if (e.key === 'Backspace' && !query && (props.selected || []).length) {
              props.onRemove(props.selected[props.selected.length - 1]);
            }
          },
          placeholder: (props.selected && props.selected.length) ? '' : (optionsLoaded ? ('+ add ' + props.label.toLowerCase()) : 'loading…'),
          style:{background:'transparent', border:'none', outline:'none', color:'var(--tx)', fontSize:11, padding:'2px 4px', minWidth:160, flex:1}
        })
      ),
      open ? React.createElement('div', {style:{position:'absolute', top:'calc(100% + 2px)', left:0, right:0, background:'var(--sf)', border:'1px solid var(--bd)', borderRadius:4, maxHeight:280, overflow:'auto', zIndex:50, boxShadow:'0 6px 20px rgba(0,0,0,0.5)'}},
        !optionsLoaded ? React.createElement('div', {style:{padding:'8px 10px', fontSize:11, color:'var(--mt)'}}, 'Loading list…')
        : shown.length === 0 ? React.createElement('div', {style:{padding:'8px 10px', fontSize:11, color:'var(--mt)'}}, query ? 'No matches' : 'All values selected')
        : [].concat(
            shown.map(function(m) {
              return React.createElement('div', {
                key: m,
                onMouseDown: function(e) { e.preventDefault(); pick(m); },
                onClick: function(e) { e.preventDefault(); pick(m); },
                style:{padding:'5px 9px', fontSize:11, cursor:'pointer', borderBottom:'1px solid var(--bd)', whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis'},
                onMouseEnter: function(e) { e.currentTarget.style.background = 'var(--sf2)' },
                onMouseLeave: function(e) { e.currentTarget.style.background = '' }
              }, m);
            }),
            truncated ? [React.createElement('div', {key:'__more', style:{padding:'5px 9px', fontSize:10, color:'var(--mt)', fontStyle:'italic'}}, '+ ' + (matches.length - 80) + ' more — keep typing to narrow')] : []
          )
      ) : null
    )
  );
}

function MarginPage() {
  var today = new Date();
  var ytdStart = today.getFullYear() + '-01-01';
  var todayStr = today.toISOString().slice(0,10);

  var fState = React.useState({
    start: ytdStart, end: todayStr,
    entities: [], categories: [], customers: [], items: [], channels: [], segments: [], sales_reps: []
  });
  var f = fState[0], setF = fState[1];
  var dState = React.useState('category');
  var dim = dState[0], setDim = dState[1];
  var cmpState = React.useState('none');
  var compare = cmpState[0], setCompare = cmpState[1];
  var rState = React.useState(null);
  var rows = rState[0], setRows = rState[1];
  var tState = React.useState(null);
  var tot = tState[0], setTot = tState[1];
  var lState = React.useState(false);
  var loading = lState[0], setLoading = lState[1];
  var syncState = React.useState(null);
  var syncInfo = syncState[0], setSyncInfo = syncState[1];
  var dimVals = React.useState({entity: [], category: [], customer: [], item: [], channel: [], segment: [], sales_rep: []});
  var values = dimVals[0], setValues = dimVals[1];
  var drState = React.useState(null);
  var drillState = drState[0], setDrill = drState[1];
  var spState = React.useState({});
  var sparks = spState[0], setSparks = spState[1];
  var svState = React.useState([]);
  var savedViews = svState[0], setSavedViews = svState[1];

  function loadSavedViews() {
    sbq('saved_views', 'select=id,name,description,is_shared,config,user_id&order=name')
      .then(function(rs){ setSavedViews(rs || []) });
  }
  React.useEffect(loadSavedViews, []);

  function applyView(v) {
    var c = v.config || {};
    setF({
      start: c.start || ytdStart, end: c.end || todayStr,
      entities: c.entities || [], categories: c.categories || [],
      customers: c.customers || [], items: c.items || [],
      channels: c.channels || [], segments: c.segments || []
    });
    setDim(c.dim || 'category');
    setCompare(c.compare || 'none');
    if (typeof c.showOH === 'boolean') setShowOH(c.showOH);
  }

  function saveCurrentView() {
    var name = prompt('Name this view:');
    if (!name) return;
    var shared = confirm('Share with everyone? OK = shared, Cancel = just for me.');
    var cfg = {
      dim: dim, compare: compare,
      start: f.start, end: f.end,
      entities: f.entities, categories: f.categories,
      customers: f.customers, items: f.items,
      channels: f.channels, segments: f.segments,
      showOH: showOH
    };
    sbAuth.auth.getSession().then(function(s) {
      var uid = s && s.data && s.data.session && s.data.session.user && s.data.session.user.id;
      if (!uid) { alert('Not signed in.'); return; }
      sbInsert('saved_views', { user_id: uid, name: name, is_shared: shared, config: cfg })
        .then(loadSavedViews);
    });
  }
  function deleteView(id) {
    if (!confirm('Delete this saved view?')) return;
    sbDelete('saved_views', 'id=eq.' + encodeURIComponent(id)).then(loadSavedViews);
  }
  var bktState = React.useState(null);
  var buckets = bktState[0], setBuckets = bktState[1];
  var perState = React.useState(null);
  var periodRev = perState[0], setPeriodRev = perState[1];
  var ohState = React.useState(true);
  var showOH = ohState[0], setShowOH = ohState[1];
  var segMapState = React.useState({});  // segment_code → label
  var segMap = segMapState[0], setSegMap = segMapState[1];

  function computePrev(start, end, mode) {
    if (mode === 'none') return [null, null];
    var s = new Date(start), e = new Date(end);
    if (mode === 'prior_year') {
      var ps = new Date(s); ps.setFullYear(ps.getFullYear() - 1);
      var pe = new Date(e); pe.setFullYear(pe.getFullYear() - 1);
      return [ps.toISOString().slice(0,10), pe.toISOString().slice(0,10)];
    }
    var span = Math.round((e - s) / 86400000) + 1;
    var pe2 = new Date(s); pe2.setDate(pe2.getDate() - 1);
    var ps2 = new Date(pe2); ps2.setDate(ps2.getDate() - span + 1);
    return [ps2.toISOString().slice(0,10), pe2.toISOString().slice(0,10)];
  }
  var prev = computePrev(f.start, f.end, compare);

  React.useEffect(function() {
    setLoading(true);
    var args = {
      p_start: f.start, p_end: f.end,
      p_entities: f.entities.length ? f.entities : null,
      p_categories: f.categories.length ? f.categories : null,
      p_customers: f.customers.length ? f.customers : null,
      p_items: f.items.length ? f.items : null,
      p_channels: f.channels.length ? f.channels : null,
      p_segments: f.segments.length ? f.segments : null,
      p_sales_reps: f.sales_reps.length ? f.sales_reps : null
    };
    var pivotArgs = Object.assign({}, args, {p_dim: dim, p_limit: 250});
    if (compare !== 'none') {
      pivotArgs.p_prev_start = prev[0];
      pivotArgs.p_prev_end = prev[1];
    }
    var pivotFn = compare === 'none' ? 'fn_sales_pivot' : 'fn_sales_pivot_compare';
    Promise.all([
      sbrpc(pivotFn, pivotArgs),
      sbrpc('fn_sales_totals', args)
    ]).then(function(res) {
      setRows(res[0] || []);
      setTot((res[1] && res[1][0]) || null);
      setLoading(false);
    });
  }, [dim, compare, f.start, f.end, f.entities.join('|'), f.categories.join('|'), f.customers.join('|'), f.items.join('|'), f.channels.join('|'), f.segments.join('|'), f.sales_reps.join('|')]);

  React.useEffect(function() {
    sbq('qbo_items', 'select=synced_at,purchase_cost&order=synced_at.desc&limit=1')
      .then(function(rs) {
        if (rs && rs.length) setSyncInfo({synced_at: rs[0].synced_at});
        else setSyncInfo({synced_at: null});
      });
  }, []);

  // Fetch trailing-12-month sparkline data for the visible top rows.
  React.useEffect(function() {
    if (!rows || !rows.length) { setSparks({}); return; }
    var labels = rows.slice(0, 60).map(function(r){ return r.dim_label });
    sbrpc('fn_sparkline', {

    setRunning(function(p){ var n = Object.assign({}, p); n[slug] = true; return n });
    setMsg(function(p){ var n = Object.assign({}, p); n[slug] = 'running…'; return n });
    fetch(SB_URL + '/functions/v1/' + slug, {
      method:'POST', headers:{ 'apikey':SB_KEY, 'Authorization':'Bearer '+SB_KEY }
    }).then(function(r){ return r.json() })
      .then(function(j) {
        var summary;
        if (j.ok) {
          summary = 'OK';
          if (j.synced != null) summary += ' · ' + j.synced + ' synced';
          if (j.upserted != null && j.upserted !== j.synced) summary += ' / ' + j.upserted + ' upserted';
          if (j.with_purchase_cost != null) summary += ' · ' + j.with_purchase_cost + ' w/cost';
          if (j.with_qbo_type != null) summary += ' · ' + j.with_qbo_type + ' w/type';
          if (j.duration_ms) summary += ' · ' + j.duration_ms + 'ms';
        } else {
          summary = 'FAIL: ' + (j.error || 'unknown');
        }
        setMsg(function(p){ var n = Object.assign({}, p); n[slug] = summary; return n });
        load();
      })
      .catch(function(e) {
        setMsg(function(p){ var n = Object.assign({}, p); n[slug] = 'ERROR: ' + e.message; return n });
      })
      .finally(function() {
        setRunning(function(p){ var n = Object.assign({}, p); delete n[slug]; return n });
      });
  }

  function fmtAge(ts) {
    if (!ts) return '—';
    var d = new Date(ts);
    var min = Math.round((Date.now() - d.getTime()) / 60000);
    if (min < 60) return min + 'm ago';
    if (min < 1440) return Math.round(min/60) + 'h ago';
    return Math.round(min/1440) + 'd ago';
  }

  return React.createElement('div', null,
    React.createElement('div', {className:'cd', style:{marginBottom:10}},
      React.createElement('div', {className:'ct'}, 'QBO TOKEN STATUS — REALM ' + (tok ? tok.realm_id : '—')),
      tok ? React.createElement('div', {style:{fontSize:11, color:'var(--mt)', lineHeight:1.7}},
        'Access token expires: ' + new Date(tok.access_token_expires_at).toLocaleString(),
        React.createElement('br'),
        'Refresh token expires: ' + new Date(tok.refresh_token_expires_at).toLocaleString(),
        React.createElement('br'),
        'Refresh count: ' + tok.refresh_count + ' · last by: ' + (tok.last_refreshed_by || '—'),
        tok.last_error ? React.createElement('div', {style:{color:'var(--rd)', marginTop:6}}, 'Last error: ' + tok.last_error) : null
      ) : React.createElement('div', {style:{color:'var(--mt)', fontSize:11}}, 'Loading…')
    ),
    React.createElement('div', {className:'cd', style:{padding:0, marginBottom:10}},
      React.createElement('div', {style:{padding:'10px 14px', borderBottom:'1px solid var(--bd)'}},
        React.createElement('div', {className:'ct', style:{margin:0}}, 'EDGE FUNCTIONS')
      ),
      React.createElement('table', null,
        React.createElement('thead', null, React.createElement('tr', null,
          React.createElement('th', null, 'Function'),
          React.createElement('th', null, 'Description'),
          React.createElement('th', null, 'Last Result'),
          React.createElement('th', {style:{textAlign:'right'}}, '')
        )),
        React.createElement('tbody', null, SYNC_FUNCTIONS.map(function(fn) {
          var lastLog = (logs || []).find(function(l){ return l.function_name === fn.slug });
          return React.createElement('tr', {key:fn.slug},
            React.createElement('td', null,
              React.createElement('div', {style:{fontWeight:600}}, fn.label),
              React.createElement('div', {style:{fontSize:10, color:'var(--mt)'}}, fn.slug)
            ),
            React.createElement('td', {style:{fontSize:11, color:'var(--mt)'}}, fn.desc),
            React.createElement('td', {style:{fontSize:11}},
              msg[fn.slug] ? React.createElement('div', null, msg[fn.slug]) : null,
              lastLog ? React.createElement('div', {style:{color:'var(--mt)', fontSize:10}}, lastLog.status + ' · ' + fmtAge(lastLog.finished_at || lastLog.started_at)) : null
            ),
            React.createElement('td', {style:{textAlign:'right'}},
              React.createElement('button', {onClick: function(){ trigger(fn.slug) }, disabled: !!running[fn.slug], style:btnPrimary()}, running[fn.slug] ? '…' : 'RUN')
            )
          );
        }))
      )
    ),
    React.createElement(PushBackPanel)
  );
}

function PushBackPanel() {
  var rState = React.useState(null);
  var result = rState[0], setResult = rState[1];
  var bState = React.useState(false);
  var busy = bState[0], setBusy = bState[1];

  function call(commit) {
    setBusy(true); setResult(null);
    fetch(SB_URL + '/functions/v1/push-qbo-customer-types', {
      method:'POST',
      headers:{ 'apikey':SB_KEY, 'Authorization':'Bearer '+SB_KEY, 'Content-Type':'application/json' },
      body: JSON.stringify({ commit: !!commit })
    }).then(function(r){ return r.json() })
      .then(function(j){ setResult(j); setBusy(false) })
      .catch(function(e){ setResult({ok:false, error:e.message}); setBusy(false) });
  }

  return React.createElement('div', {className:'cd'},
    React.createElement('div', {className:'ct'}, 'PUSH PRIMARY CHANNELS TO QBO'),
    React.createElement('div', {style:{fontSize:11, color:'var(--mt)', lineHeight:1.6, marginBottom:12}},
      'Writes each customer’s primary channel into Customer.CustomerType in QBO so the classification shows up there too. CustomerTypes are created automatically if they don’t already exist.',
      React.createElement('br'),
      'Sales-rep push back is a separate slice (QBO doesn’t have a built-in rep field on Customer; needs a CustomField mapping or Class on transactions — still TBD).'
    ),
    React.createElement('div', {style:{display:'flex', gap:8, marginBottom:10}},
      React.createElement('button', {onClick: function(){ call(false) }, disabled: busy,
        style: btnSecondary()}, busy ? '…' : 'DRY RUN (PREVIEW)'),
      React.createElement('button', {onClick: function(){ if (!confirm('Commit changes to QBO? This will UPDATE customer records.')) return; call(true) }, disabled: busy,
        style: Object.assign({}, btnPrimary(), {background:'var(--am)', borderColor:'var(--am)'})}, 'COMMIT TO QBO')
    ),
    result ? React.createElement('div', {style:{padding:'10px 12px', background:'var(--sf2)', border:'1px solid var(--bd)', borderRadius:4, fontSize:11, fontFamily:'monospace', whiteSpace:'pre-wrap', maxHeight:240, overflow:'auto'}},
      JSON.stringify(result, null, 2)) : null
  );
}

// Tiny inline UI helpers
function InlineText(props) {
  var sState = React.useState(props.value || '');
  var v = sState[0], setV = sState[1];
  React.useEffect(function(){ setV(props.value || '') }, [props.value]);
  return React.createElement('input', {
    type:'text', value:v, onChange:function(e){ setV(e.target.value) },
    onBlur: function(){ if (v !== props.value) props.onSave(v) },
    onKeyDown: function(e){ if (e.key === 'Enter') e.target.blur() },
    style: Object.assign({}, inp(), {width:'100%'})
  });
}
function InlineNum(props) {
  var sState = React.useState(props.value == null ? '' : String(props.value));
  var v = sState[0], setV = sState[1];
  React.useEffect(function(){ setV(props.value == null ? '' : String(props.value)) }, [props.value]);
  return React.createElement('input', {
    type:'number', value:v, onChange:function(e){ setV(e.target.value) },
    onBlur: function(){ var n = Number(v); if (n !== props.value) props.onSave(n) },
    onKeyDown: function(e){ if (e.key === 'Enter') e.target.blur() },
    style: Object.assign({}, inp(), {width:60})
  });
}
function inp() { return {background:'var(--sf2)', border:'1px solid var(--bd)', color:'var(--tx)', padding:'4px 6px', borderRadius:4, fontSize:11} }
function btnPrimary() { return {background:'var(--ac)', color:'var(--bg)', border:'1px solid var(--ac)', padding:'4px 10px', borderRadius:4, fontSize:10, cursor:'pointer', fontWeight:700, letterSpacing:.5} }
function btnSecondary() { return {background:'var(--sf2)', color:'var(--tx)', border:'1px solid var(--bd)', padding:'4px 10px', borderRadius:4, fontSize:10, cursor:'pointer', letterSpacing:.5} }
function btnDanger() { return {background:'transparent', color:'var(--rd)', border:'1px solid var(--bd)', padding:'2px 7px', borderRadius:4, fontSize:11, cursor:'pointer'} }

function LoginScreen(props) {
  var eState = React.useState('');
  var email = eState[0], setEmail = eState[1];
  var pState = React.useState('');
  var password = pState[0], setPassword = pState[1];
  var bState = React.useState(false);
  var busy = bState[0], setBusy = bState[1];
  var msgState = React.useState('');
  var msg = msgState[0], setMsg = msgState[1];

  function submit(e) {
    e && e.preventDefault();
    if (!email || !password) return;
    setBusy(true); setMsg('');
    sbAuth.auth.signInWithPassword({ email: email.trim(), password: password })
      .then(function(res) {
        if (res.error) { setMsg(res.error.message); setBusy(false); }
        else { props.onLogin && props.onLogin(res.data.session); }
      })
      .catch(function(err) { setMsg(err.message || String(err)); setBusy(false); });
  }

  return React.createElement('div', {style:{minHeight:'100vh', display:'flex', alignItems:'center', justifyContent:'center', padding:20}},
    React.createElement('form', {onSubmit: submit, className:'cd', style:{width:380, maxWidth:'100%', padding:'24px 28px'}},
      React.createElement('div', {style:{fontSize:13, fontWeight:700, letterSpacing:1.5, color:'var(--ac)', marginBottom:4}}, 'PACER \u00b7 MARGIN ANALYTICS'),
      React.createElement('div', {style:{fontSize:10, color:'var(--mt)', marginBottom:24, letterSpacing:.5}}, 'Sign in to continue'),
      React.createElement('label', {style:{display:'block', fontSize:10, color:'var(--mt)', textTransform:'uppercase', letterSpacing:1, marginBottom:4}}, 'Email'),
      React.createElement('input', {type:'email', autoComplete:'email', value:email, onChange:function(e){setEmail(e.target.value)},
        style:{width:'100%', background:'var(--sf2)', border:'1px solid var(--bd)', color:'var(--tx)', padding:'8px 10px', borderRadius:4, fontSize:13, marginBottom:14}}),
      React.createElement('label', {style:{display:'block', fontSize:10, color:'var(--mt)', textTransform:'uppercase', letterSpacing:1, marginBottom:4}}, 'Password'),
      React.createElement('input', {type:'password', autoComplete:'current-password', value:password, onChange:function(e){setPassword(e.target.value)},
        style:{width:'100%', background:'var(--sf2)', border:'1px solid var(--bd)', color:'var(--tx)', padding:'8px 10px', borderRadius:4, fontSize:13, marginBottom:18}}),
      msg ? React.createElement('div', {style:{color:'var(--rd)', fontSize:11, marginBottom:12}}, msg) : null,
      React.createElement('button', {type:'submit', disabled:busy,
        style:{width:'100%', background:'var(--ac)', color:'var(--bg)', border:'none', padding:'10px', borderRadius:4, fontSize:12, fontWeight:700, letterSpacing:1, cursor:'pointer', textTransform:'uppercase'}},
        busy ? 'Signing in\u2026' : 'Sign in'),
      React.createElement('div', {style:{fontSize:10, color:'var(--mt)', marginTop:14, lineHeight:1.5}},
        'Accounts are managed in Supabase Studio. Ask Sky for credentials.')
    )
  );
}

function App() {
  var sessState = React.useState(undefined);
  var session = sessState[0], setSession = sessState[1];

  React.useEffect(function() {
    // If served through the apbg-gateway proxy, the gateway has already
    // signed the user in and stored a session under 'apbg_session' in
    // localStorage. Bootstrap the dashboard's Supabase session from it
    // so users don't see a second login screen.
    try {
      var raw = localStorage.getItem('apbg_session');
      if (raw) {
        var g = JSON.parse(raw);
        var exp = g && g.expiresAt;
        var notExpired = exp && (
          typeof exp === 'number' ? exp * 1000 > Date.now() : Date.parse(exp) > Date.now()
        );
        if (g && g.token && g.refreshToken && notExpired) {
          sbAuth.auth.setSession({ access_token: g.token, refresh_token: g.refreshToken });
        }
      }
    } catch (e) {}

    sbAuth.auth.getSession().then(function(res) { setSession(res.data.session || null) });
    var sub = sbAuth.auth.onAuthStateChange(function(_evt, s) { setSession(s || null) });
    return function(){ sub.data && sub.data.subscription && sub.data.subscription.unsubscribe() };
  }, []);

  if (session === undefined) {
    return React.createElement('div', {className:'ld', style:{minHeight:'100vh'}}, 'Loading\u2026');
  }
  if (session === null) {
    return React.createElement(LoginScreen, {onLogin: function(s){ setSession(s) }});
  }
  return React.createElement(MainApp, {session: session, onLogout: function(){ sbAuth.auth.signOut().then(function(){ setSession(null) }) }});
}

function MainApp(props) {
  var validViews = ['margin', 'customers', 'settings'];
  function viewFromHash() {
    var h = (window.location.hash || '').replace(/^#/, '').split('?')[0];
    return validViews.indexOf(h) >= 0 ? h : 'margin';
  }
  var vState = React.useState(viewFromHash);
  var view = vState[0], setView = vState[1];

  React.useEffect(function() {
    function onHash() { setView(viewFromHash()) }
    window.addEventListener('hashchange', onHash);
    return function(){ window.removeEventListener('hashchange', onHash) };
  }, []);

  function navTo(id) {
    if (id === view) return;
    if (window.location.hash !== '#' + id) {
      window.history.replaceState(null, '', '#' + id);
    }
    setView(id);
  }

  function tab(id, label) {
    var on = view === id;
    return React.createElement('a', {
      key:id, href:'#' + id, onClick: function(e){ e.preventDefault(); navTo(id) },
      style:{
        textDecoration:'none',
        background: on ? 'var(--ac)' : 'transparent',
        color: on ? 'var(--bg)' : 'var(--tx)',
        border:'1px solid ' + (on ? 'var(--ac)' : 'var(--bd)'),
        padding:'5px 12px', borderRadius:4, fontSize:11, fontWeight: on ? 700 : 500,
        letterSpacing:.5, marginRight:6
      }
    }, label);
  }

  var content = view === 'customers' ? React.createElement(CustomersPage)
              : view === 'settings'  ? React.createElement(SettingsPage)
              : React.createElement(MarginPage);

  var userEmail = props.session && props.session.user && props.session.user.email;

  return React.createElement(React.Fragment, null,
    React.createElement('div', {className:'tb'},
      React.createElement('div', {className:'lg'}, 'PACER \u00b7 MARGIN ANALYTICS',
        React.createElement('small', null, 'Sales \u00b7 Customers \u00b7 Items \u00b7 Margin')
      ),
      React.createElement('div', {style:{display:'flex', alignItems:'center', gap:10}},
        tab('margin', 'MARGIN'), tab('customers', 'CUSTOMERS'), tab('settings', 'SETTINGS'),
        React.createElement('span', {style:{fontSize:10, color:'var(--mt)', marginLeft:6}}, userEmail || ''),
        React.createElement('button', {onClick: props.onLogout,
          style:{background:'transparent', color:'var(--mt)', border:'1px solid var(--bd)', padding:'4px 9px', borderRadius:4, fontSize:10, cursor:'pointer', letterSpacing:.5}},
          'SIGN OUT')
      )
    ),
    React.createElement('div', {className:'ma'}, content)
  )
}

ReactDOM.render(React.createElement(App), document.getElementById('root'));
</script>
