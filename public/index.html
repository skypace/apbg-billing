<!DOCTYPE html>

<title>Moved to Brixpense</title>
<!--
  The AP bill-intake page that used to live here is RETIRED (2026-09-03).

  It was a PDF drop that OCR'd a vendor bill and emailed an approve link;
  clicking that link created the Bill in QuickBooks. Brixpense replaced it,
  and the evidence that nobody was still using it was unambiguous: no hub
  tile has pointed at /billing/ since the June 2026 redesign folded 3rd-Party
  Billing into Brixpense, every bill for the last 120 days arrived through
  Service Fusion (97) or the bills@ inbox (5), and its approval email had been
  going to a suppressed address since 2026-05-15 — fifteen weeks of silence
  that nobody reported.

  ⚠ The real reason to remove it rather than leave it sitting there: both
  halves were UNAUTHENTICATED. process-inbound would OCR a PDF for anyone who
  found the URL (our Anthropic spend), and approve.html's manual-entry path
  would post a vendor bill straight into QuickBooks with no sign-in at all.

  This file stays as a redirect rather than being deleted so old bookmarks
  land somewhere useful instead of a 404.
-->
<meta http-equiv="refresh" content="0; url=https://alamedapointbg.com/expense/">
<link rel="canonical" href="https://alamedapointbg.com/expense/">
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:#0F172A;color:#E2E8F0;
       font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}
  .card{max-width:420px;padding:32px;text-align:center;line-height:1.55}
  h1{font-size:20px;margin:0 0 10px;color:#fff;letter-spacing:-.01em}
  p{font-size:14px;color:#94A3B8;margin:0 0 20px}
  a{display:inline-block;background:#3B82F6;color:#fff;text-decoration:none;font-weight:600;
    font-size:14px;padding:12px 24px;border-radius:8px}
</style>
</head>
<body>
  <div class="card">
    <h1>Bill intake has moved</h1>
    <p>Vendor bills are handled in Brixpense now. Taking you there&nbsp;&hellip;</p>
    <a href="https://alamedapointbg.com/expense/">Open Brixpense &rarr;</a>
  </div>
  <script>location.replace('https://alamedapointbg.com/expense/');</script>
</body>
</html>
