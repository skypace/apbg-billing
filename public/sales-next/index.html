<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/sales-next/favicon.svg" />
    <link rel="icon" type="image/png" href="/sales-next/Brix-Round-Logo.png" />
    <link rel="apple-touch-icon" href="/sales-next/Brix-Round-Logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <title>BRIX Refractor</title>
    <!-- Pre-paint: honor the universal APBG theme switch (gateway waffle writes
         localStorage.apbg_theme) before React mounts, so there's no flash.
         theme.css overrides + the MUI theme both key off data-apbg-theme. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('apbg_theme') === 'light' ? 'light' : 'dark';
          document.documentElement.setAttribute('data-apbg-theme', t);
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', t === 'light' ? '#EEF3F8' : '#000000');
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Unified type system: one neutral grotesque (Helvetica Neue / Arial) for
         all text — a system font, so no webfont is loaded for it. Only JetBrains
         Mono (numerics) comes from Google Fonts. -->
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script type="module" crossorigin src="/sales-next/assets/index-T1c1oDOn.js"></script>
    <link rel="stylesheet" crossorigin href="/sales-next/assets/index-IFwOURZL.css">
  </head>
  <body>
    <div id="root"></div>
    <script src="https://alamedapointbg.com/appswitcher.js" defer></script>
</body>
</html>
